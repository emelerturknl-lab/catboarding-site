<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi - Black Princess</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #D9A3A3; --secondary: #F4E7E7; --dark: #4A4A4A; }
        body { font-family: 'Outfit', sans-serif; background: #fffafb; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: var(--dark); }
        #login-screen { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        h2 { font-family: 'Dancing Script', cursive; font-size: 2.5rem; color: var(--primary); margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #eee; border-radius: 12px; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%; transition: all 0.3s; }
        .btn:hover { background: #c88a8a; transform: translateY(-2px); }
        .btn-secondary { background: #f5f5f5; color: #666; margin-top: 10px; }
        #login-error { color: #e74c3c; font-size: 0.9rem; margin-top: 15px; display: none; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div style="font-family: 'Dancing Script', cursive; font-size: 3rem; color: var(--primary); margin-bottom: 20px;">Black Princess</div>
        <p>Oturum kontrol ediliyor...</p>
    </div>

    <div id="login-screen" style="display: none;">
        <h2>Yönetici Girişi</h2>
        <p style="color:#888; margin-bottom:30px;">Lütfen Supabase bilgilerinizle giriş yapın.</p>
        <div id="login-box">
            <div class="form-group">
                <input type="email" id="email" placeholder="admin@catboardingalmere.nl">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Şifreniz">
            </div>
            <button type="button" class="btn" id="login-btn" onclick="performLogin()">Giriş Yap</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">🏠 Web Sitesine Dön</button>
            <p id="login-error"></p>
        </div>
    </div>

    <script src="assets/js/supabase-client.js"></script>

    <script>
        const ADMIN_EMAIL = 'admin@catboardingalmere.nl';

        // Initial Session Check
        async function checkInitialSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                if (session.user.email === ADMIN_EMAIL) {
                    window.location.href = 'private-admin-8xK29.html';
                } else {
                    await supabase.auth.signOut();
                    showLogin();
                }
            } else {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
        }

        async function performLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');

            if (!email || !password) {
                err.innerText = "Lütfen tüm alanları doldurun.";
                err.style.display = "block";
                return;
            }

            btn.innerHTML = "Giriş Yapılıyor..."; btn.disabled = true;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                btn.innerHTML = "Giriş Yap"; btn.disabled = false;
                err.innerText = "Giriş başarısız. Lütfen bilgilerinizi kontrol edin.";
                err.style.display = "block";
            } else {
                if (data.user.email !== ADMIN_EMAIL) {
                    await supabase.auth.signOut();
                    btn.innerHTML = "Giriş Yap"; btn.disabled = false;
                    err.innerText = "Yetkisiz erişim denemesi!";
                    err.style.display = "block";
                } else {
                    window.location.href = 'private-admin-8xK29.html';
                }
            }
        }

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performLogin();
        });

        checkInitialSession();
    </script>
</body>
</html>
